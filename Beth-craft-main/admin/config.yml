backend:
  name: git-gateway
  branch: main

media_folder: "Beth-craft-main/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "bags"
    label: "Beaded Bags"
    files:
      - label: "Manage Bags Gallery"
        name: "bags_gallery"
        file: "Beth-craft-main/data/bags.json"
        fields:
          - label: "Bags"
            name: "items"
            widget: "list"
            fields:
              - {label: "Image", name: "image", widget: "image"}