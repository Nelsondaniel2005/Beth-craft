backend:
  name: git-gateway
  branch: main

media_folder: "Beth-craft-main/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "bags"
    label: "Beaded Bags"
    folder: "Beth-craft-main/images/bags"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}